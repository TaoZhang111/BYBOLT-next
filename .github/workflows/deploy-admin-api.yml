name: Deploy BYBOLT Admin API

on:
  push:
    branches: [main]
    paths:
      - "workers/admin-api/**"
      - "scripts/prepare-cloudflare-business-resources.mjs"
      - ".github/workflows/deploy-admin-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-cloudflare-business-resources.mjs workers/admin-api/wrangler.jsonc
      - run: mkdir -p workers/admin-api/.wrangler
      - run: pnpm exec wrangler types workers/admin-api/.wrangler/types.d.ts --config workers/admin-api/wrangler.jsonc
      - run: pnpm exec tsc --noEmit --project workers/admin-api/tsconfig.json
      - run: pnpm exec wrangler d1 migrations apply DB --remote --config workers/admin-api/wrangler.jsonc
      - run: pnpm exec wrangler deploy --config workers/admin-api/wrangler.jsonc
